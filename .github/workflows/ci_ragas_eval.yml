name: OrderPulse AI — RAGAS & LLMOps Evaluation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ragas-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic httpx numpy fastapi

      - name: Run 20-question RAGAS & FinOps Quality Gate
        run: python scripts/evaluate_ragas.py

      - name: Upload RAGAS & Langfuse Reports
        uses: actions/upload-artifact@v4
        with:
          name: ragas-evaluation-reports
          path: reports/
